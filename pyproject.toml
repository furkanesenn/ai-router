[project]
name = "ai-router"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "furkanesenv", email = "furkanesen1900@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.19.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
ai-router = "ai_router:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
